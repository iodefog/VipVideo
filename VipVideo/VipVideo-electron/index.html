<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>VIP Video</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="webview-container">
    <webview id="webview" src="about:blank" allowpopups="true" allow="autoplay; encrypted-media"
      webpreferences="contextIsolation=yes, nodeIntegration=no, sandbox=yes" partition="persist:netease"
      preload="webview-preload.js"></webview>
  </div>
  <div id="button-container">
    <button id="before-button"></button>
    <div id="platform-buttons"></div>
    <button id="more-button"></button>
    <button id="custom-button">编辑</button>
    <button id="history-button">历史</button>
    <button id="topmost-button" type="button" aria-pressed="false" title="让电视窗口始终显示在其他窗口上方">置顶</button>
    <button id="transparent-topmost-button" type="button" aria-pressed="false" title="失去焦点后半透明显示，同时保持置顶">半透明置顶</button>
    <button id="update-button">升级</button>
    <!-- <button id="devtools-button" title="切换 WebView DevTools (Ctrl/Cmd+Shift+I 或 F12)">DevTools</button> -->
  </div>
  <script src="renderer.js"></script>
</body>

</html>
